<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>habibiii ✨</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Prevents unwanted browser scrolling on mobile touch drag */
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #170d2b 0%, #0c0717 60%, #05030a 100%);
            font-family: 'Fredoka', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient glowing background aura */
        .ambient-glow {
            position: absolute;
            width: 45vw;
            height: 45vw;
            max-width: 500px;
            max-height: 500px;
            background: radial-gradient(circle, rgba(255, 121, 198, 0.25) 0%, rgba(189, 147, 249, 0.15) 40%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
            animation: pulseAura 6s ease-in-out infinite alternate;
        }

        @keyframes pulseAura {
            0% {
                transform: scale(0.9);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        /* Starfield & Sparkle Canvas */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Center Main Text */
        .title-container {
            position: relative;
            z-index: 5;
            text-align: center;
            pointer-events: none; /* Allows touch events to register smoothly everywhere */
        }

        .habibi-text {
            font-size: clamp(4rem, 16vw, 11rem);
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.02em;
            text-shadow: 
                0 0 15px rgba(255, 121, 198, 0.9),
                0 0 35px rgba(255, 121, 198, 0.7),
                0 0 65px rgba(189, 147, 249, 0.6),
                0 0 100px rgba(139, 233, 253, 0.4);
            animation: floatText 5s ease-in-out infinite;
        }

        @keyframes floatText {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-16px) rotate(1deg);
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Glow behind text -->
    <div class="ambient-glow"></div>

    <!-- Main Centered Text -->
    <div class="title-container">
        <h1 class="habibi-text">habibiii...</h1>
    </div>

    <!-- Canvas for Stars, Sparkles & Touch Particles -->
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let bgStars = [];
        let particles = [];
        let isTouching = false;
        let lastTouchX = 0;
        let lastTouchY = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initBgStars();
        }

        // --- Background Twinkling Stars ---
        function initBgStars() {
            bgStars = [];
            const count = Math.floor((width * height) / 8000);
            for (let i = 0; i < count; i++) {
                bgStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005,
                    color: ['#ff79c6', '#bd93f9', '#8be9fd', '#ffb86c', '#ffffff'][Math.floor(Math.random() * 5)]
                });
            }
        }

        function drawBgStars() {
            for (let star of bgStars) {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0.1) star.speed = -star.speed;

                ctx.save();
                ctx.globalAlpha = Math.max(0, Math.min(1, star.alpha));
                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- Magic Touch Particle Physics ---
        const particleColors = ['#ff79c6', '#ff92d0', '#bd93f9', '#8be9fd', '#ffb86c', '#ffffff'];

        class Particle {
            constructor(x, y, isBurst = false) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 10 + 6;
                const speedScale = isBurst ? 7 : 3;
                this.vx = (Math.random() - 0.5) * speedScale;
                this.vy = (Math.random() - 0.5) * speedScale - (isBurst ? 1.5 : 0.5);
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.015;
                this.color = particleColors[Math.floor(Math.random() * particleColors.length)];
                this.rotation = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.1;
                // Types: 'heart', 'star', 'sparkle', 'orb'
                const rand = Math.random();
                if (rand < 0.35) this.type = 'heart';
                else if (rand < 0.7) this.type = 'star';
                else if (rand < 0.9) this.type = 'sparkle';
                else this.type = 'orb';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.03; // Soft float / gravity
                this.vx *= 0.98;
                this.rotation += this.vRot;
                this.life -= this.decay;
            }

            draw() {
                if (this.life <= 0) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 12;

                const s = this.size;

                if (this.type === 'heart') {
                    // Cute Mini Heart
                    const scale = s / 12;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.bezierCurveTo(-5 * scale, -5 * scale, -10 * scale, 2 * scale, 0, 10 * scale);
                    ctx.bezierCurveTo(10 * scale, 2 * scale, 5 * scale, -5 * scale, 0, 0);
                    ctx.fill();
                } else if (this.type === 'star') {
                    // 5-Point Star
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * s, -Math.sin((18 + i * 72) * Math.PI / 180) * s);
                        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (s / 2), -Math.sin((54 + i * 72) * Math.PI / 180) * (s / 2));
                    }
                    ctx.closePath();
                    ctx.fill();
                } else if (this.type === 'sparkle') {
                    // 4-Point Magic Sparkle
                    ctx.beginPath();
                    ctx.moveTo(0, -s);
                    ctx.quadraticCurveTo(0, 0, s, 0);
                    ctx.quadraticCurveTo(0, 0, 0, s);
                    ctx.quadraticCurveTo(0, 0, -s, 0);
                    ctx.quadraticCurveTo(0, 0, 0, -s);
                    ctx.fill();
                } else {
                    // Soft Glowing Orb
                    ctx.beginPath();
                    ctx.arc(0, 0, s / 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function spawnSparkles(x, y, count = 5, isBurst = false) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, isBurst));
            }
        }

        // --- Interaction Handlers (Mouse & Touch) ---
        function handlePointerDown(e) {
            isTouching = true;
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            if (x !== undefined && y !== undefined) {
                lastTouchX = x;
                lastTouchY = y;
                spawnSparkles(x, y, 18, true); // Extra magic burst on initial tap/click
            }
        }

        function handlePointerMove(e) {
            let x, y;
            if (e.touches && e.touches[0]) {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }

            if (x !== undefined && y !== undefined) {
                // Spawn particle trail on movement
                const dist = Math.hypot(x - lastTouchX, y - lastTouchY);
                if (dist > 4) {
                    spawnSparkles(x, y, 2, false);
                    lastTouchX = x;
                    lastTouchY = y;
                }
            }
        }

        function handlePointerUp() {
            isTouching = false;
        }

        window.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', (e) => {
            handlePointerMove(e);
        });
        window.addEventListener('mouseup', handlePointerUp);

        window.addEventListener('touchstart', (e) => {
            handlePointerDown(e);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            handlePointerMove(e);
        }, { passive: true });

        window.addEventListener('touchend', handlePointerUp);

        // --- Animation Loop ---
        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawBgStars();

            // Update & Draw Magic Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
